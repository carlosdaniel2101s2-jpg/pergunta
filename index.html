<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responda a pergunta 👀</title>

    <!-- Open Graph -->
    <meta property="og:title" content="Responda a pergunta 👀">
    <meta property="og:description" content="Clique para responder.">
    <meta property="og:type" content="website">

    <meta property="og:url" content="SEU-LINK-AQUI">

    <meta property="og:image" content="SEU-LINK-AQUI/preview.jpg">

    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta property="og:site_name" content="Responda a pergunta">
    <meta property="og:locale" content="pt_BR">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Responda a pergunta 👀">
    <meta name="twitter:description" content="Clique para responder.">
    <meta name="twitter:image" content="SEU-LINK-AQUI/preview.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="background">

        <div class="grid"></div>

        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>

    </div>


    <div class="mouse-glow"></div>


    <main class="container">

        <section class="card">

            <div class="top-light"></div>

            <div class="badge">

                <span class="badge-dot"></span>

                oportunidade imperdível

            </div>


            <div class="emoji">
                👀
            </div>


            <p class="mini-title">
                Tenho uma pergunta importante...
            </p>


            <h1>
                Eai, Vamo
                <span>vender curso?</span>
            </h1>


            <p class="description">
                Pense bem antes de escolher.
            </p>


            <div class="buttons-area">

                <button
                    id="sim"
                    class="btn btn-sim"
                    type="button">

                    <span class="btn-text">
                        Sim
                    </span>

                    <span class="arrow">
                        →
                    </span>

                </button>


                <button
                    id="nao"
                    class="btn btn-nao"
                    type="button">

                    Não

                </button>

            </div>


            <p class="warning">
                escolha com sabedoria 😏
            </p>


            <div class="decoration decoration-1"></div>
            <div class="decoration decoration-2"></div>

        </section>

    </main>


    <footer class="footer">
        © Carlos Daniel
    </footer>


    <script src="script.js"></script>

</body>

</html>
